name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: macos-15, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Install ffmpeg and MKVToolNix (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg mkvtoolnix

      - name: Fetch the exact tools bundled in the installers (Windows / macOS)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          python packaging/fetch_tools.py --target auto --dest build/tools
          echo "KIZUNA_TOOLS_DIR=$(python -c 'import os; print(os.path.abspath("build/tools"))')" >> "$GITHUB_ENV"

      - name: Byte-compile
        run: python -m compileall -q src tests packaging

      - name: Run tests
        run: python -m pytest -v -rs

      - name: Self-test from source
        shell: bash
        run: cd src && python -m kizuna --self-test
