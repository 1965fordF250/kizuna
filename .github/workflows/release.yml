name: Release

# Push a tag like v1.0.0 (matching __version__ in src/kizuna/__init__.py) to build
# the installers and create a DRAFT GitHub release. Review it, then click "Publish".
# Run manually (workflow_dispatch) to build and test the installers without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Read version and check it matches the tag
        run: |
          VERSION=$(python3 -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('src/kizuna/__init__.py').read()).group(1))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$VERSION" ]]; then
            echo "::error::Tag ${GITHUB_REF#refs/tags/} does not match __version__ $VERSION"; exit 1
          fi
          grep -q "^## \[$VERSION\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; }

  windows:
    needs: [tests, version]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-build.txt
      - run: python packaging/fetch_tools.py --target windows-x64 --dest build/tools
      - run: python packaging/make_icon.py build
      - run: pyinstaller --noconfirm --clean --distpath dist --workpath build/pyi packaging/kizuna.spec

      - name: Self-test the built app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Kizuna\Kizuna.exe" -ArgumentList '--self-test', "`"$PWD\build\selftest.txt`"" -Wait -PassThru
          Get-Content build\selftest.txt
          if ($p.ExitCode -ne 0) { throw "self-test failed ($($p.ExitCode))" }

      - name: Check the folder picker starts
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "pick.txt"
          $p = Start-Process -FilePath "dist\Kizuna\Kizuna.exe" -ArgumentList '--pick-folder', 'Test', '""', "`"$out`"" -PassThru
          Start-Sleep 8
          if ($p.HasExited) { throw "folder picker exited immediately (code $($p.ExitCode)); is Tk bundled?" }
          Stop-Process -Id $p.Id -Force
          Write-Host "folder dialog opened and stayed open"

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc "/DAppVersion=$env:VERSION" "/DRepoUrl=${{ github.server_url }}/${{ github.repository }}" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Test the installer (silent install, self-test, uninstall)
        shell: pwsh
        run: |
          $setup = Get-ChildItem "dist\Kizuna-$env:VERSION-Windows-x64-Setup.exe"
          $dir = Join-Path $env:RUNNER_TEMP "TM Install"
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$dir`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "install failed ($($p.ExitCode))" }
          $report = Join-Path $env:RUNNER_TEMP "installed-selftest.txt"
          $p = Start-Process (Join-Path $dir "Kizuna.exe") -ArgumentList '--self-test', "`"$report`"" -Wait -PassThru
          Get-Content $report
          if ($p.ExitCode -ne 0) { throw "self-test of the installed app failed" }
          Start-Process (Join-Path $dir "unins000.exe") -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path (Join-Path $dir "Kizuna.exe")); $i++) { Start-Sleep 1 }
          if (Test-Path (Join-Path $dir "Kizuna.exe")) { throw "uninstall left the app behind" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/Kizuna-*-Windows-x64-Setup.exe
          if-no-files-found: error

  macos:
    needs: [tests, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: arm64, target: macos-arm64 }
          - { runner: macos-15-intel, arch: x86_64, target: macos-x86_64 }
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-build.txt
      - run: python packaging/fetch_tools.py --target ${{ matrix.target }} --dest build/tools
      - run: python packaging/make_icon.py build
      - run: pyinstaller --noconfirm --clean --distpath dist --workpath build/pyi packaging/kizuna.spec

      - name: Check architecture and signature
        run: |
          file "dist/Kizuna.app/Contents/MacOS/Kizuna" | tee /dev/stderr | grep -q "${{ matrix.arch }}"
          codesign --verify --deep --strict --verbose=2 "dist/Kizuna.app"

      - name: Self-test the built app
        run: |
          "dist/Kizuna.app/Contents/MacOS/Kizuna" --self-test build/selftest.txt || { cat build/selftest.txt; exit 1; }
          cat build/selftest.txt

      - name: Build and test the disk image
        run: |
          packaging/macos/make_dmg.sh "$VERSION" "${{ matrix.arch }}"
          M=$(mktemp -d); T=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$M" "dist/Kizuna-$VERSION-macOS-${{ matrix.arch }}.dmg"
          ditto "$M/Kizuna.app" "$T/Kizuna.app"
          hdiutil detach "$M"
          "$T/Kizuna.app/Contents/MacOS/Kizuna" --self-test "$T/r.txt" || { cat "$T/r.txt"; exit 1; }
          cat "$T/r.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/Kizuna-*-macOS-${{ matrix.arch }}.dmg
          if-no-files-found: error

  sources:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 packaging/fetch_tools.py --target sources --dest build/sources
      - uses: actions/upload-artifact@v4
        with:
          name: third-party-sources
          path: build/sources/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, windows, macos, sources]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums and release notes
        run: |
          cd assets && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt && cd ..
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          ### Other files in this release
          - `ffmpeg-*.tar.xz` and `mkvtoolnix-*.tar.xz`: source code of the bundled ffmpeg and
            MKVToolNix, provided as their licenses require. You don't need these to use Kizuna.
          - `SHA256SUMS.txt`: checksums, if you want to verify your download.

          ### Code signing policy
          Free code signing provided by [SignPath.io](https://about.signpath.io/), certificate by
          [SignPath Foundation](https://signpath.org/) (applied for; until it's approved, the Windows
          installer is unsigned). Team roles and privacy: see the
          [code signing policy](https://github.com/1965fordF250/kizuna#code-signing-policy).
          EOF
      - name: Create draft release
        run: gh release create "v$VERSION" assets/* --draft --title "Kizuna $VERSION" --notes-file notes.md
